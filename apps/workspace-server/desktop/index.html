<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop</title>
    <style>
      html,
      body,
      #desktop {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #20242b;
        color: white;
        font: 14px system-ui;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        pointer-events: none;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="desktop" aria-label="Workspace desktop"></div>
    <div id="status" role="status">Connecting to desktop…</div>
    <script type="module">
      import RFB from "./core/rfb.js";
      const display = document.getElementById("desktop");
      const status = document.getElementById("status");
      const endpoint = new URL("stream", location.href);
      endpoint.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      let connection;
      let retry;
      let mode;
      let active = false;
      let connected = false;
      let closed = false;
      let lastActivity = 0;
      function activity() {
        if (Date.now() - lastActivity < 1000) return;
        lastActivity = Date.now();
        window.parent.postMessage({ type: "halo:user-activity" }, "*");
      }
      for (const event of ["pointermove", "pointerdown", "keydown", "wheel"]) {
        document.addEventListener(event, activity, {
          capture: true,
          passive: true,
        });
      }
      function renderStatus() {
        status.hidden = mode === "running" && connected;
        if (mode === "asleep") status.textContent = "Asleep";
        else if (mode === "waking") status.textContent = "Waking…";
        else if (mode === "sleeping") status.textContent = "Sleeping…";
        else
          status.textContent = connection
            ? "Connecting to desktop…"
            : "Reconnecting to desktop…";
      }
      function disconnect() {
        clearTimeout(retry);
        retry = undefined;
        const previous = connection;
        connection = undefined;
        connected = false;
        // Ignore the old socket's disconnect event before it can queue a retry.
        previous?.disconnect();
      }
      function setMode(nextMode) {
        if (closed) return;
        mode = nextMode;
        const nextActive = mode === "running" || mode === "sleeping";
        if (nextActive !== active) {
          active = nextActive;
          if (active) connect();
          else disconnect();
        }
        renderStatus();
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.type !== "halo:desktop-state") return;
        if (
          !["running", "sleeping", "asleep", "waking"].includes(event.data.mode)
        )
          return;
        setMode(event.data.mode);
      });
      function connect() {
        if (closed || !active || connection !== undefined) return;
        clearTimeout(retry);
        retry = undefined;
        const socket = new RFB(display, endpoint.href);
        connection = socket;
        socket.scaleViewport = true;
        socket.resizeSession = true;
        renderStatus();
        socket.addEventListener("connect", () => {
          if (socket !== connection) return;
          connected = true;
          renderStatus();
        });
        socket.addEventListener("disconnect", () => {
          if (socket !== connection) return;
          connection = undefined;
          connected = false;
          renderStatus();
          if (closed || !active) return;
          clearTimeout(retry);
          retry = setTimeout(connect, 1500);
        });
      }
      window.addEventListener("pagehide", () => {
        closed = true;
        active = false;
        disconnect();
      });
      // Embedded panes wait for Halo's state; direct desktop URLs work alone.
      if (window.parent === window) setMode("running");
    </script>
  </body>
</html>
