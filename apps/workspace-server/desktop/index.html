<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop</title>
    <style>
      html,
      body,
      #desktop {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #20242b;
        color: white;
        font: 14px system-ui;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        pointer-events: none;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="desktop" aria-label="Workspace desktop"></div>
    <div id="status" role="status">Connecting to desktop…</div>
    <script type="module">
      import RFB from "./core/rfb.js";
      const display = document.getElementById("desktop");
      const status = document.getElementById("status");
      const endpoint = new URL("stream", location.href);
      endpoint.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      let connection;
      let retry;
      let closed = false;
      let lastActivity = 0;
      function activity() {
        if (Date.now() - lastActivity < 1000) return;
        lastActivity = Date.now();
        window.parent.postMessage({ type: "halo:user-activity" }, "*");
      }
      for (const event of ["pointermove", "pointerdown", "keydown", "wheel"]) {
        document.addEventListener(event, activity, {
          capture: true,
          passive: true,
        });
      }
      // Resume can invalidate the old proxy socket while its last frame remains.
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.type === "halo:workspace-ready") location.reload();
      });
      function connect() {
        connection = new RFB(display, endpoint.href);
        connection.scaleViewport = true;
        connection.resizeSession = true;
        connection.addEventListener("connect", () => {
          status.hidden = true;
        });
        connection.addEventListener("disconnect", () => {
          if (closed) return;
          status.hidden = false;
          status.textContent = "Reconnecting to desktop…";
          retry = setTimeout(connect, 1500);
        });
      }
      window.addEventListener("pagehide", () => {
        closed = true;
        clearTimeout(retry);
        connection.disconnect();
      });
      connect();
    </script>
  </body>
</html>
