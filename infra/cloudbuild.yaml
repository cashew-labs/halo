steps:
  - name: docker:27.5.1-cli
    entrypoint: sh
    args:
      - -ec
      - |
        image="${_IMAGE}"
        cache_image="${_CACHE_IMAGE}"
        if [ -z "$${cache_image}" ]; then
          cache_image="$${image%:*}:build-cache"
        fi
        docker buildx create --driver docker-container --use
        docker buildx build \
          --push \
          --progress plain \
          --cache-from "type=registry,ref=$${cache_image}" \
          --cache-to "type=registry,ref=$${cache_image},mode=max" \
          --file apps/workspace-server/Dockerfile \
          --tag "$${image}" \
          --build-arg "VERSION=${_VERSION}" \
          --build-arg "REVISION=${_REVISION}" \
          .
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
substitutions:
  # Override for isolated build tests; releases use a stable tag per repository/target.
  _CACHE_IMAGE: ""
  _VERSION: dev
  _REVISION: local
