name: Release Halo

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "releases/*.json"

concurrency:
  group: ${{ github.event_name != 'pull_request' && 'halo-production' || format('halo-release-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test release validation
        run: node --test releases/release.test.mjs

      - name: Find release manifest
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          mapfile -t manifests < <(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- "releases/*.json")
          if [ "${#manifests[@]}" -eq 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "A release must add exactly one releases/<version>.json file"
            exit 1
          fi
          version="$(node releases/validateRelease.mjs "${manifests[0]}")"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview production infrastructure
    if: github.event_name == 'pull_request' && needs.prepare.outputs.is_release == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require deployment identity
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository variables"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Pulumi backend
        run: pnpm --filter @get-halo/infra exec pulumi login gs://halo-relay-pulumi-state

      - name: Preview Pulumi changes
        id: pulumi
        continue-on-error: true
        run: |
          pnpm --filter @get-halo/infra exec pulumi -C control-plane preview \
            --stack west \
            --non-interactive \
            --color never \
            --suppress-outputs > "$RUNNER_TEMP/pulumi-preview.txt" 2>&1

      - name: Post Pulumi preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "<!-- halo-pulumi-preview -->"
            echo "### Production Pulumi preview"
            echo '```text'
            tail -c 50000 "$RUNNER_TEMP/pulumi-preview.txt"
            echo
            echo '```'
          } > "$RUNNER_TEMP/pulumi-comment.md"

          comment_id="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- halo-pulumi-preview -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" \
              -F "body=@$RUNNER_TEMP/pulumi-comment.md"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \
              --body-file "$RUNNER_TEMP/pulumi-comment.md"
          fi

      - name: Fail when preview failed
        if: steps.pulumi.outcome == 'failure'
        run: exit 1

  release-ready:
    name: Release ready
    if: always() && github.event_name == 'pull_request'
    needs: [prepare, preview, test-e2e]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check release validation
        env:
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Release validation failed"
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$PREVIEW_RESULT" != "success" ]; then
            echo "The production Pulumi preview failed"
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$E2E_RESULT" != "success" ]; then
            echo "The release E2E tests did not pass"
            exit 1
          fi

  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    needs: [prepare, build-desktop]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      workspace_image: ${{ steps.images.outputs.workspace_image }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: halo-relay
      REGION: us-west2
      VERSION: ${{ needs.prepare.outputs.version }}
      ZONE: us-west2-a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment identity
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository variables"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Pulumi backend
        run: pnpm --filter @get-halo/infra exec pulumi login gs://halo-relay-pulumi-state

      - name: Verify source protocol manifest
        run: |
          pnpm --silent --filter @get-halo/control-plane exec tsx ../../releases/protocols.mjs > "$RUNNER_TEMP/protocols.json"
          jq -e --slurpfile actual "$RUNNER_TEMP/protocols.json" '.protocols == $actual[0]' "releases/$VERSION.json"

      - name: Build release images
        id: images
        shell: bash
        run: |
          bucket="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output buildSourceBucket --stack west)"
          builder="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output buildServiceAccount --stack west)"
          image_root="$REGION-docker.pkg.dev/$PROJECT/halo-west-workspaces"
          control_plane_image="$image_root/control-plane:$VERSION-$GITHUB_SHA"
          transition_image="$control_plane_image-backend"
          previous_version="$(jq -r .previousVersion "releases/$VERSION.json")"
          previous_image="$image_root/control-plane:$previous_version"
          previous_digest="$(gcloud artifacts docker images describe "$previous_image" --project="$PROJECT" --format='value(image_summary.digest)')"
          previous_image="$image_root/control-plane@$previous_digest"
          workspace_image="$REGION-docker.pkg.dev/$PROJECT/halo-west-workspaces/workspace-server:$VERSION-$GITHUB_SHA"

          build_image() {
            local image="$1"
            local config="$2"
            local substitutions="_IMAGE=$image,_VERSION=$VERSION,_REVISION=$GITHUB_SHA"
            if [ "$config" = "infra/controlplane.cloudbuild.yaml" ]; then
              substitutions="$substitutions,_TARGET=$3,_PREVIOUS_IMAGE=$previous_image"
            fi
            # A workflow retry reuses the image already built for this immutable release version.
            if gcloud artifacts docker images describe "$image" --project="$PROJECT" >/dev/null 2>&1; then
              echo "Reusing $image"
              return
            fi
            gcloud builds submit . \
              --project="$PROJECT" \
              --region="$REGION" \
              --config="$config" \
              --ignore-file=infra/buildignore \
              --gcs-source-staging-dir="gs://$bucket/source" \
              --service-account="$builder" \
              --substitutions="$substitutions"
          }

          build_image "$transition_image" infra/controlplane.cloudbuild.yaml transition
          build_image "$control_plane_image" infra/controlplane.cloudbuild.yaml frontend
          build_image "$workspace_image" infra/cloudbuild.yaml
          pin_image() {
            local digest
            digest="$(gcloud artifacts docker images describe "$1" --project="$PROJECT" --format='value(image_summary.digest)')"
            test -n "$digest"
            echo "${1%:*}@$digest"
          }
          echo "transition_image=$(pin_image "$transition_image")" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$(pin_image "$control_plane_image")" >> "$GITHUB_OUTPUT"
          echo "workspace_image=$(pin_image "$workspace_image")" >> "$GITHUB_OUTPUT"

      - name: Deploy backends with the previous browser bundle
        env:
          TRANSITION_IMAGE: ${{ steps.images.outputs.transition_image }}
          WORKSPACE_IMAGE: ${{ steps.images.outputs.workspace_image }}
        run: |
          pnpm --filter @get-halo/infra exec pulumi -C control-plane up --stack west --yes --non-interactive \
            --config "halo-control-plane:controlPlaneImage=$TRANSITION_IMAGE" \
            --config "halo-control-plane:workspaceImage=$WORKSPACE_IMAGE"

      - name: Check control plane
        shell: bash
        run: |
          origin="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output controlPlaneUrl --stack west)"
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "$origin/health"
          node apps/control-plane/scripts/verifyRelease.mjs "$origin" "releases/$VERSION.json" "$GITHUB_SHA"

      - name: Recreate workspace VMs
        env:
          WORKSPACE_IMAGE: ${{ steps.images.outputs.workspace_image }}
        shell: bash
        run: |
          template="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output workspaceInstanceTemplate --stack west)"
          template_name="${template##*/}"
          template_details="$(gcloud compute instance-templates describe "$template_name" \
            --project="$PROJECT" --format=json)"
          startup_script="$RUNNER_TEMP/workspace-startup.sh"
          jq -r '.properties.metadata.items[] | select(.key == "startup-script") | .value' \
            <<< "$template_details" > "$startup_script"

          mapfile -t instances < <(gcloud compute instances list \
            --project="$PROJECT" \
            --zones="$ZONE" \
            --filter='name~"^halo-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"' \
            --format='value(name)')

          if [ "${#instances[@]}" -eq 0 ]; then
            echo "No production workspace VMs found; refusing to publish the desktop"
            exit 1
          fi

          for instance in "${instances[@]}"; do
            details="$(gcloud compute instances describe "$instance" \
              --project="$PROJECT" --zone="$ZONE" --format=json)"
            workspace_id="${instance#halo-}"
            workspace_label="$(jq -r '.labels["halo-workspace-id"] // empty' <<< "$details")"
            if [ -n "$workspace_label" ] && [ "$workspace_label" != "$workspace_id" ]; then
              echo "$instance has workspace label $workspace_label; expected $workspace_id"
              exit 1
            fi

            owner_user_id="$(jq -r '.metadata.items[] | select(.key == "halo-owner-user-id") | .value' <<< "$details")"
            if [ -z "$owner_user_id" ]; then
              echo "$instance has no halo-owner-user-id metadata"
              exit 1
            fi

            disk="$(jq -r '[.disks[] | select(.boot == false and .deviceName == "halo-workspace") | .source | split("/")[-1]] | if length == 1 then .[0] else empty end' <<< "$details")"
            expected_disk="halo-$workspace_id-workspace"
            if [ "$disk" != "$expected_disk" ]; then
              echo "$instance has workspace disk $disk; expected $expected_disk"
              exit 1
            fi

            metadata=("halo-owner-user-id=$owner_user_id" "halo-workspace-id=$workspace_id")
            while IFS=$'\t' read -r key value; do
              metadata+=("$key=$value")
            done < <(jq -r '.properties.metadata.items[] | select(.key != "startup-script" and .key != "halo-owner-user-id" and .key != "halo-workspace-id") | [.key, .value] | @tsv' \
              <<< "$template_details")
            metadata_csv="$(IFS=,; echo "${metadata[*]}")"

            gcloud compute instances delete "$instance" \
              --project="$PROJECT" --zone="$ZONE" --keep-disks=data --quiet
            gcloud compute instances create "$instance" \
              --project="$PROJECT" \
              --zone="$ZONE" \
              --source-instance-template="$template" \
              --labels="halo-workspace-id=$workspace_id" \
              --metadata="$metadata_csv" \
              --metadata-from-file="startup-script=$startup_script" \
              --disk="name=$disk,device-name=halo-workspace,mode=rw,boot=no,auto-delete=no"

            expected_image="$WORKSPACE_IMAGE"
            protocols="$(jq -c .protocols.workspace.supported "releases/$VERSION.json")"
            ready_marker="HALO_WORKSPACE_READY image=$expected_image protocols=$protocols revision=$GITHUB_SHA"
            ready=false
            for attempt in $(seq 1 120); do
              if gcloud compute instances get-serial-port-output "$instance" \
                --project="$PROJECT" --zone="$ZONE" --port=1 2>/dev/null | \
                grep --fixed-strings --quiet "$ready_marker"; then
                ready=true
                break
              fi
              sleep 5
            done

            if [ "$ready" != "true" ]; then
              echo "$instance did not report readiness for $expected_image"
              gcloud compute instances get-serial-port-output "$instance" \
                --project="$PROJECT" --zone="$ZONE" --port=1 | tail -n 200
              exit 1
            fi
          done

  test-e2e:
    name: Test release E2Es
    if: github.event_name == 'pull_request' && needs.prepare.outputs.is_release == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    needs: prepare
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      TURBO_UI: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @get-halo/extension-tools exec playwright install chromium

      - name: Run all package E2Es, including packaged Electron
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm --silent --filter @get-halo/control-plane exec tsx ../../releases/protocols.mjs > "$RUNNER_TEMP/protocols.json"
          jq -e --slurpfile actual "$RUNNER_TEMP/protocols.json" '.protocols == $actual[0]' "releases/$VERSION.json"
          pnpm run test:e2e:release

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-macos
          path: |
            tmp/e2e
            tmp/extension-prototype
            tmp/server
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [prepare, deploy, promote-browser]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Reusing GitHub Release $VERSION"
          else
            gh release create "$VERSION" \
              --repo "$REPOSITORY" \
              --target "$SHA" \
              --title "$VERSION" \
              --generate-notes \
              --draft
          fi

  build-desktop:
    name: Prepare signed macOS artifacts
    if: github.event_name == 'push'
    needs: prepare
    environment: Release
    runs-on: blacksmith-6vcpu-macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse verified artifacts from this run
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '[.artifacts[] | select(.name == "desktop-'"$GITHUB_SHA"'" and .expired == false)] | length' | awk '{total += $1} END {print total}')"
          if [ "$count" -gt 0 ]; then
            gh run download "$GITHUB_RUN_ID" --name "desktop-$GITHUB_SHA" --dir "$RUNNER_TEMP/prepared"
            node releases/preparedArtifact.mjs verify "$RUNNER_TEMP/prepared" "$VERSION" "$GITHUB_SHA"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Import Apple signing certificate
        if: steps.prepared.outputs.exists != 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write Apple notarization key
        if: steps.prepared.outputs.exists != 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "APPLE_API_KEY_BASE64 did not decode to a .p8 private key"
            exit 1
          fi
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed release
        if: steps.prepared.outputs.exists != 'true'
        working-directory: apps/electron
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: pnpm exec electron-forge publish --dry-run

      - name: Verify signed release
        if: steps.prepared.outputs.exists != 'true'
        working-directory: apps/electron
        run: |
          app="out/Halo-darwin-arm64/Halo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Archive verified artifacts
        if: steps.prepared.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          tar -czf "$RUNNER_TEMP/prepared/desktop.tgz" -C apps/electron out/make out/publish-dry-run
          node releases/preparedArtifact.mjs record "$RUNNER_TEMP/prepared" "$VERSION" "$GITHUB_SHA"

      - name: Retain prepared release
        if: steps.prepared.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ github.sha }}
          path: ${{ runner.temp }}/prepared
          retention-days: 30
          if-no-files-found: error

  promote-browser:
    name: Promote browser after backend readiness
    if: github.event_name == 'push'
    needs: [prepare, deploy]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    env:
      FRONTEND_IMAGE: ${{ needs.deploy.outputs.frontend_image }}
      WORKSPACE_IMAGE: ${{ needs.deploy.outputs.workspace_image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @get-halo/infra exec pulumi login gs://halo-relay-pulumi-state
      - name: Promote prepared browser image
        run: |
          pnpm --filter @get-halo/infra exec pulumi -C control-plane up --stack west --yes --non-interactive \
            --config "halo-control-plane:controlPlaneImage=$FRONTEND_IMAGE" \
            --config "halo-control-plane:workspaceImage=$WORKSPACE_IMAGE"
          origin="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output controlPlaneUrl --stack west)"
          node apps/control-plane/scripts/verifyRelease.mjs "$origin" "releases/$VERSION.json" "$GITHUB_SHA"
          # The next transition uses the actual last published browser image.
          gcloud artifacts docker tags add "$FRONTEND_IMAGE" \
            "us-west2-docker.pkg.dev/halo-relay/halo-west-workspaces/control-plane:$VERSION" --project=halo-relay --quiet
          gcloud artifacts docker tags add "$WORKSPACE_IMAGE" \
            "us-west2-docker.pkg.dev/halo-relay/halo-west-workspaces/workspace-server:$VERSION" --project=halo-relay --quiet

  publish:
    name: Publish prepared macOS artifacts
    if: github.event_name == 'push'
    needs: [prepare, release]
    environment: Release
    runs-on: blacksmith-6vcpu-macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ github.sha }}
          path: ${{ runner.temp }}/prepared
      - name: Verify and restore prepared artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node releases/preparedArtifact.mjs verify "$RUNNER_TEMP/prepared" "$VERSION" "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/prepared/desktop.tgz" -C apps/electron
      - name: Publish to GitHub Releases without rebuilding
        working-directory: apps/electron
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec electron-forge publish --from-dry-run
      - name: Make completed release available to the updater
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --latest
