name: Release Halo

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "releases/*.json"

concurrency:
  group: ${{ github.event_name == 'push' && 'halo-production' || format('halo-release-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find release manifest
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          mapfile -t manifests < <(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- "releases/*.json")
          if [ "${#manifests[@]}" -eq 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "A release must add exactly one releases/<version>.json file"
            exit 1
          fi
          version="$(node releases/validateRelease.mjs "${manifests[0]}")"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview production infrastructure
    if: github.event_name == 'pull_request' && needs.prepare.outputs.is_release == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require deployment identity
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository variables"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Pulumi backend
        run: pnpm --filter @get-halo/infra exec pulumi login gs://halo-relay-pulumi-state

      - name: Preview Pulumi changes
        id: pulumi
        continue-on-error: true
        run: |
          pnpm --filter @get-halo/infra exec pulumi -C control-plane preview \
            --stack west \
            --non-interactive \
            --color never \
            --suppress-outputs > "$RUNNER_TEMP/pulumi-preview.txt" 2>&1

      - name: Post Pulumi preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "<!-- halo-pulumi-preview -->"
            echo "### Production Pulumi preview"
            echo '```text'
            tail -c 50000 "$RUNNER_TEMP/pulumi-preview.txt"
            echo
            echo '```'
          } > "$RUNNER_TEMP/pulumi-comment.md"

          comment_id="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- halo-pulumi-preview -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" \
              -F "body=@$RUNNER_TEMP/pulumi-comment.md"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \
              --body-file "$RUNNER_TEMP/pulumi-comment.md"
          fi

      - name: Fail when preview failed
        if: steps.pulumi.outcome == 'failure'
        run: exit 1

  release-ready:
    name: Release ready
    if: always() && github.event_name == 'pull_request'
    needs: [prepare, preview]
    runs-on: ubuntu-latest
    steps:
      - name: Check release validation
        env:
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Release validation failed"
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$PREVIEW_RESULT" != "success" ]; then
            echo "The production Pulumi preview failed"
            exit 1
          fi

  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    needs: [prepare, test-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: halo-relay
      REGION: us-west2
      VERSION: ${{ needs.prepare.outputs.version }}
      ZONE: us-west2-a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment identity
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository variables"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Pulumi backend
        run: pnpm --filter @get-halo/infra exec pulumi login gs://halo-relay-pulumi-state

      - name: Build release images
        shell: bash
        run: |
          bucket="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output buildSourceBucket --stack west)"
          builder="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output buildServiceAccount --stack west)"
          control_plane_image="$REGION-docker.pkg.dev/$PROJECT/halo-west-workspaces/control-plane:$VERSION"
          workspace_image="$REGION-docker.pkg.dev/$PROJECT/halo-west-workspaces/workspace-server:$VERSION"

          build_image() {
            local image="$1"
            local config="$2"
            # A workflow retry reuses the image already built for this immutable release version.
            if gcloud artifacts docker images describe "$image" --project="$PROJECT" >/dev/null 2>&1; then
              echo "Reusing $image"
              return
            fi
            gcloud builds submit . \
              --project="$PROJECT" \
              --region="$REGION" \
              --config="$config" \
              --ignore-file=infra/buildignore \
              --gcs-source-staging-dir="gs://$bucket/source" \
              --service-account="$builder" \
              --substitutions="_IMAGE=$image"
          }

          build_image "$control_plane_image" infra/controlplane.cloudbuild.yaml
          build_image "$workspace_image" infra/cloudbuild.yaml

      - name: Apply Pulumi changes
        run: pnpm --filter @get-halo/infra exec pulumi -C control-plane up --stack west --yes --non-interactive

      - name: Check control plane
        shell: bash
        run: |
          origin="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output controlPlaneUrl --stack west)"
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "$origin/health"

      - name: Recreate workspace VMs
        shell: bash
        run: |
          template="$(pnpm --silent --filter @get-halo/infra exec pulumi -C control-plane stack output workspaceInstanceTemplate --stack west)"
          template_name="${template##*/}"
          template_details="$(gcloud compute instance-templates describe "$template_name" \
            --project="$PROJECT" --format=json)"
          startup_script="$RUNNER_TEMP/workspace-startup.sh"
          jq -r '.properties.metadata.items[] | select(.key == "startup-script") | .value' \
            <<< "$template_details" > "$startup_script"

          mapfile -t instances < <(gcloud compute instances list \
            --project="$PROJECT" \
            --zones="$ZONE" \
            --filter='labels.halo-workspace-id:*' \
            --format='value(name)')

          for instance in "${instances[@]}"; do
            details="$(gcloud compute instances describe "$instance" \
              --project="$PROJECT" --zone="$ZONE" --format=json)"
            workspace_id="$(jq -r '.labels["halo-workspace-id"]' <<< "$details")"
            owner_user_id="$(jq -r '.metadata.items[] | select(.key == "halo-owner-user-id") | .value' <<< "$details")"
            disk="halo-$workspace_id-workspace"
            metadata=(--metadata "halo-owner-user-id=$owner_user_id")
            while IFS=$'\t' read -r key value; do
              metadata+=(--metadata "$key=$value")
            done < <(jq -r '.properties.metadata.items[] | select(.key != "startup-script" and .key != "halo-owner-user-id") | [.key, .value] | @tsv' \
              <<< "$template_details")

            gcloud compute instances delete "$instance" \
              --project="$PROJECT" --zone="$ZONE" --keep-disks=data --quiet
            gcloud compute instances create "$instance" \
              --project="$PROJECT" \
              --zone="$ZONE" \
              --source-instance-template="$template" \
              --labels="halo-workspace-id=$workspace_id" \
              "${metadata[@]}" \
              --metadata-from-file="startup-script=$startup_script" \
              --disk="name=$disk,device-name=halo-workspace,mode=rw,boot=no,auto-delete=no"
          done

  test-electron:
    name: Test desktop release
    if: github.event_name == 'push'
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run packaged Electron tests
        run: pnpm --filter @get-halo/desktop test:e2e

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-macos
          path: tmp/e2e
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Reusing GitHub Release $VERSION"
          else
            gh release create "$VERSION" \
              --repo "$REPOSITORY" \
              --target "$SHA" \
              --title "$VERSION" \
              --generate-notes \
              --latest
          fi

  publish:
    name: Publish macOS
    if: github.event_name == 'push'
    needs: [prepare, release]
    environment: Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write Apple notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "APPLE_API_KEY_BASE64 did not decode to a .p8 private key"
            exit 1
          fi
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to GitHub Releases
        working-directory: apps/electron
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: pnpm run publish
